# titer configuration. See https://github.com/greerviau/titer for every option.

[[runner]]
name = "root"
kind = "vitest"
command = ["npx", "--no-install", "vitest", "run"]

[[runner]]
name = "src-tauri"
kind = "cargo"
cwd = "src-tauri"
command = ["cargo", "test", "--locked"]

[gate]
# fail_on_survivors = false
# fail_on_passes_on_base = false
# fail_on_scan = false
# fail_on_crap = false

[mutate]
# The budget counts from the start of the check, and the head and base runs
# build the Tauri crate first, so the 120 s default leaves no mutant time.
budget = "30m"
# Tool configuration, not application code.
exclude_globs = ["vitest.config.ts", "eslint.config.js"]
