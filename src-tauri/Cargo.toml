[package]
name = "conch"
version = "0.6.1"
edition = "2024"
license = "MIT"
[lib]
name = "conch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
regex-syntax = "0.8"
ignore = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "8"
tokio = { version = "1", features = ["rt", "time", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
arboard = "3"
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
[dev-dependencies]
tempfile = "3"
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
